services:
  mongodb:
    image: mongo:7.0
    command: ["--bind_ip_all"]
    ports:
      - 27017:27017
    volumes:
      - ./dump:/dump

  tdorp-parse-server:
    image: ghcr.io/shoogland/timmerdorp-parse
    ports:
      - 1337:1337
    environment:
      - DATABASE_URI=mongodb://mongodb:27017/dev
      - APP_ID=myAppId
      - JS_KEY=jsKey

  redis:
    image: "redis:alpine"
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      start_period: 5s
      retries: 10